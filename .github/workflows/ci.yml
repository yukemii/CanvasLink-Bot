name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canvaslink
          POSTGRES_PASSWORD: canvaslink
          POSTGRES_DB: canvaslink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvaslink -d canvaslink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANVASLINK_TEST_DATABASE_URL: postgres://canvaslink:canvaslink@127.0.0.1:5432/canvaslink_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -w $(git ls-files '*.go')
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
